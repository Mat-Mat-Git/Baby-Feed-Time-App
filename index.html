<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Feeding Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen">
        <div class="container">
            <h1>🍼 Baby Feeding Tracker</h1>
            <div class="login-form">
                <input type="password" id="passwordInput" placeholder="Enter password" />
                <button onclick="window.login()">Login</button>
                <p class="error-message" id="loginError"></p>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="screen hidden">
        <div class="container">
            <div class="header">
                <h1>🍼 Feeding Tracker</h1>
                <button class="logout-btn" onclick="window.logout()">Logout</button>
            </div>

            <!-- Feeding Entry Form -->
            <div class="feeding-form">
                <h2>New Feeding</h2>

                <div class="form-group">
                    <label for="feedingTime">Time:</label>
                    <input type="datetime-local" id="feedingTime" />
                    <button class="btn-secondary" onclick="window.setCurrentTime()">Now</button>
                </div>

                <div class="form-group">
                    <label for="volumeInput">Volume (ml):</label>
                    <div class="volume-display">
                        <span id="volumeDisplay">0</span> ml
                    </div>
                    <input type="range" id="volumeSlider" min="0" max="330" step="10" value="0" oninput="window.updateVolumeDisplay()" />
                </div>

                <button class="btn-primary" onclick="window.addFeeding()">Add Feeding</button>
            </div>

            <!-- Feeding History -->
            <div class="feeding-history">
                <div class="tabs">
                    <button class="tab-button active" onclick="window.switchTab('history')">History</button>
                    <button class="tab-button" onclick="window.switchTab('stats')">Statistics</button>
                    <button class="tab-button" onclick="window.switchTab('graph')">Graph</button>
                </div>

                <div id="historyTab" class="tab-content active">
                    <div id="feedingList"></div>
                </div>

                <div id="statsTab" class="tab-content">
                    <div class="stats-container">
                        <div class="stat-card">
                            <div class="stat-label">Average Time Between Feeds (24h)</div>
                            <div class="stat-value" id="avgTimeBetween">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Average Volume (24h)</div>
                            <div class="stat-value" id="avgVolume">-</div>
                        </div>
                    </div>
                </div>

                <div id="graphTab" class="tab-content">
                    <div class="chart-container">
                        <div class="chart-wrapper">
                            <canvas id="feedingChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
